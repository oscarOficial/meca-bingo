<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0b1a">
<title>Meca Bingo · Player</title>
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/skins.css">
<link rel="stylesheet" href="css/events.css">
<script src="js/skin.js"></script>
<script src="js/events.js"></script>
<style>
.wrap{max-width:720px;padding:14px 10px calc(120px + env(safe-area-inset-bottom))}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.head h1{font-size:22px;color:var(--logo-color);text-shadow:var(--logo-shadow)}
#homeLink{color:inherit;text-decoration:none;display:inline-block;padding:10px 0;margin:-10px 0}
.status{font-size:12.5px}
.prize{text-align:center;margin-bottom:10px;font:800 18px var(--font-display)}.prize b{color:var(--text-highlight)}
.prize{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:nowrap}
.prize .patpic svg{height:40px;width:auto}.prize .patpic .es9{height:26px}
.cell.free{background:var(--highlight);color:var(--on-highlight);cursor:default;font-size:24px;border-color:transparent}
.board{--cellH:72px;display:grid;gap:5px;user-select:none;-webkit-user-select:none;background:var(--board-bg);border:var(--board-border);border-radius:var(--board-radius);padding:var(--board-pad);box-shadow:var(--board-shadow)}
.board.es{grid-template-columns:repeat(9,minmax(0,1fr))}
.board.us{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.cell{height:var(--cellH);border-radius:var(--cell-radius);background:var(--cell-bg);color:var(--cell-text);border:var(--cell-border-w) solid var(--cell-border);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;text-align:center;padding:4px 3px;overflow:hidden;cursor:pointer;transition:transform .12s,background .15s;font-size:14px;line-height:1.12;-webkit-tap-highlight-color:transparent}
.cell .tt{font-weight:700;overflow-wrap:normal;word-break:normal;max-width:100%}
.cell .ar{font-weight:500;color:var(--cell-muted);font-size:.78em;overflow-wrap:normal;max-width:100%}
.cell.split .tt,.cell.split .ar{overflow-wrap:anywhere;word-break:break-word;hyphens:auto;-webkit-hyphens:auto}
.cell.split .tt{word-break:break-all}
.cell.tiny .ar{display:none}
.cell.clip .tt{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--clamp);line-clamp:var(--clamp);overflow:hidden}
.cell.gap{background:var(--cell-gap-bg);border:var(--cell-gap-border);cursor:default}
/* --lit: this tile's colour when marked (skins may set four, cycling over the card) */
.cell{--lit:var(--lit-1)}.cell:nth-child(4n+2){--lit:var(--lit-2)}.cell:nth-child(4n+3){--lit:var(--lit-3)}.cell:nth-child(4n){--lit:var(--lit-4)}
.cell.on{background:var(--lit);border-color:var(--cell-on-border);color:var(--cell-on-text);box-shadow:var(--cell-on-shadow),0 0 var(--cell-glow) var(--lit)}
.cell.on::after{content:'';display:var(--mark);position:absolute;left:50%;top:50%;width:min(88%,calc(var(--cellH,72px) - 8px));aspect-ratio:1;border-radius:50%;border:var(--mark-border);border-width:var(--mark-widths);transform:translate(-50%,-50%) rotate(var(--mark-rotate));opacity:.85;pointer-events:none}
.cell.wrong{animation:wrong .5s 3;box-shadow:inset 0 0 0 3px var(--highlight)}
@keyframes wrong{50%{transform:translateX(-4px)}}
.rot{position:fixed;inset:0;z-index:8;background:color-mix(in srgb,var(--page) 96%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:30px}
.rot .ic{font-size:64px;animation:rot 1.6s ease-in-out infinite}
@keyframes rot{50%{transform:rotate(-90deg)}}
.cell.on .ar{color:var(--cell-on-muted);opacity:.9}
.cell{position:relative}
.cell:active:not(.gap){transform:scale(.94)}
.callbar{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--page) 35%);display:flex;justify-content:center;z-index:5}
.callbar .btn{width:min(520px,100%);font-size:20px;padding:16px}
.hello{max-width:420px;margin:60px auto 0;text-align:center}
.hello h2{font-size:28px;margin-bottom:14px}
.res{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:var(--scrim);text-align:center;padding:24px}
.res.on{display:flex}
.res h2{font-size:clamp(34px,10vw,60px);font-family:var(--sign-font);font-weight:var(--sign-weight);text-shadow:var(--sign-shadow)}
.res.ok h2{color:var(--result-ok);text-shadow:var(--result-ok-shadow);animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.res.no h2{color:var(--result-no);animation:shake .5s}
@keyframes pop{0%{transform:scale(.3)}100%{transform:scale(1)}}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
/* phone landscape: logo, prize, card number and status in one header row; CALL as a narrow column on the right */
@media (orientation:landscape) and (max-height:500px){.wrap{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;column-gap:10px;align-items:center;padding:6px 80px 10px 10px;max-width:none}
.head,#play,#play>.row{display:contents}#hint{display:none}
.head h1{grid-area:1/1;font-size:18px;white-space:nowrap}.head>.row{grid-area:1/4}#cardNo{grid-area:1/3;white-space:nowrap}
.prize{grid-area:1/2;margin:0;font-size:15px;line-height:1.1;gap:6px;min-width:0;min-height:40px;justify-content:safe center;container-type:inline-size}.prize>span:not(.pf){display:flex;align-items:center;gap:.3em;min-width:0}
/* too narrow: "Playing for" gives way first (ellipsis); a long prize name then wraps rather than being cut */
.prize .pf{min-width:0;flex-shrink:1000;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.prize .patpic{flex:none}@container (max-width:220px){.prize b{font-size:12.5px;line-height:1.05}}
.prize .patpic svg{height:30px}.prize .patpic .es9{height:18px}
.wrap>section,#board,#winners{grid-column:1/-1}#board{margin-top:6px}
.callbar{left:auto;top:0;right:0;bottom:0;width:72px;padding:10px 6px calc(10px + env(safe-area-inset-bottom));align-items:center;background:linear-gradient(90deg,transparent,var(--page) 25%)}
.callbar .btn{width:100%;height:min(100%,320px);padding:12px 4px;font-size:16px;line-height:1.15;white-space:normal}.callbar .btn span{writing-mode:vertical-rl;transform:rotate(180deg)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><h1><a id="homeLink" href="/en/">Meca <span class="grad">Bingo</span></a></h1><span class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn hidden" id="helpBtn" type="button" style="min-height:40px;min-width:40px;padding:6px 10px"><svg class="icon" aria-hidden="true"><use href="/img/icons.svg#circle-question-mark"/></svg></button><span class="status pill" id="status"></span></span></div>

  <section id="enter" class="hello hidden">
    <h2 id="tCode"></h2>
    <form id="codeForm" class="row"><input type="text" id="codeIn" maxlength="5" style="flex:1;text-transform:uppercase;letter-spacing:4px;font-weight:800;font-size:22px"><button class="btn cy" id="tJoin"></button></form>
  </section>

  <section id="name" class="hello hidden">
    <h2 id="tName"></h2>
    <form id="nameForm"><input type="text" id="nameIn" maxlength="24" autocomplete="nickname"><button class="btn big" id="tGo" style="width:100%;margin-top:12px"></button></form>
  </section>

  <section id="play" class="hidden">
    <div class="prize" id="prize"></div>
    <div class="row" style="justify-content:space-between;margin-bottom:8px"><span class="mut" id="hint"></span><span class="pill" id="cardNo"></span></div>
    <div class="rot hidden" id="rotate"><div class="ic"><svg class="icon" aria-hidden="true"><use href="/img/icons.svg#smartphone"/></svg></div><h2 id="tRotate"></h2><button class="btn" id="rotateAnyway"></button></div>
    <div class="board" id="board"></div>
    <div class="card mut" id="winners" style="margin-top:12px"></div>
  </section>

  <section id="msg" class="hello hidden"><h2 id="msgText"></h2></section>
</div>
<div class="callbar hidden" id="callbar"><button class="btn big" id="callBtn"></button></div>
<div class="modal" id="modal"><div><h3 id="mTitle"></h3><p id="mText"></p><div class="row" style="justify-content:flex-end"><button class="btn" id="mNo"></button><button class="btn big" id="mYes"></button></div></div></div>
<div class="modal" id="help"><div><h3 id="helpTitle"></h3><ol id="helpRules" style="margin:10px 0 10px 20px;line-height:1.55"></ol><p class="mut" id="helpPrizes" style="margin-bottom:12px"></p><button class="btn big" id="helpOk" type="button" style="width:100%"></button></div></div>
<div class="res" id="res"><h2 id="resT"></h2><p class="mut" id="resS" style="font-size:16px"></p><button class="btn" id="resBack" style="min-height:48px;margin-top:10px"></button></div>
<canvas id="fx"></canvas>
<div class="toast" id="toast"></div>

<script src="js/vendor/peerjs.min.js"></script>
<script src="js/i18n.js"></script>
<script src="js/game.js"></script>
<script src="js/patterns-ui.js"></script>
<script src="js/net.js"></script>
<script src="js/vendor/canvas-confetti.js"></script>
<script src="js/fx.js"></script>
<script src="js/play.js"></script>
</body>
</html>
