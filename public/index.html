.hero .lead{margin:18px 0 26px}
.cta{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cta .btn{text-decoration:none;display:inline-flex;align-items:center;min-height:52px}

.shots{position:relative;min-height:380px}
.shots .tv{width:100%;border-radius:14px;border:1px solid var(--line);box-shadow:0 30px 80px #000b}
.shots .ph{position:absolute;right:-6px;bottom:-30px;width:31%;border-radius:22px;border:6px solid #000;box-shadow:0 20px 50px #000c}
.free{margin-top:14px;font-size:13.5px;color:var(--mut)}

.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:26px;counter-reset:s}
.steps .card{position:relative;padding:20px 18px 18px}
.steps .card::before{counter-increment:s;content:counter(s);position:absolute;top:-14px;left:16px;width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--pink),#ff6b3d);display:grid;place-items:center;font:800 16px 'Bricolage Grotesque',sans-serif}

.steps p{color:var(--mut);font-size:14.5px;line-height:1.5}

.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px}
.roles .card{padding:22px}.roles .ic{font-size:34px}.roles h3{font-size:20px;margin:8px 0}.roles p,.roles li{color:var(--mut);font-size:14.5px;line-height:1.55}

.split{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:center;margin-top:24px}
.split img{width:100%;border-radius:14px;border:1px solid var(--line);box-shadow:0 20px 60px #0009}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.feat div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.feat b{display:block;margin-bottom:4px}.feat span{color:var(--mut);font-size:14px;line-height:1.45}
@media (max-width:860px){.split{grid-template-columns:1fr}.feat{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;margin-top:18px;font-size:15px}
th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line)}
th{color:var(--cyan);font-size:12.5px;letter-spacing:1px;text-transform:uppercase}
td.y{color:var(--green);font-weight:700}td.e{color:var(--yel);font-weight:700}
.tbl{overflow-x:auto}
.ext{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}

.browsers{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

details.q summary{font-weight:700;cursor:pointer;font-size:16px;list-style:none}

details.q[open] summary::after{content:'–'}
details.q p{color:var(--mut);margin-top:10px;line-height:1.6}
.final{text-align:center;padding:70px 0 30px}
footer{border-top:1px solid var(--line);margin-top:40px;padding:24px 0;color:var(--mut);font-size:14px;display:flex;gap:18px;flex-wrap:wrap;justify-content:space-between}
footer a{color:var(--mut)}

let lang; try { lang = JSON.parse(localStorage.getItem('meca-lang')); } catch (e) {}
lang = lang || (navigator.language || 'en').slice(0, 2); if (!L[lang]) lang = 'en';
function draw() {
  const t = L[lang]; document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(e => { e.textContent = t[e.dataset.t]; });
  document.querySelectorAll('[data-list]').forEach(e => { e.innerHTML = t[e.dataset.list].map(x => `<li>${esc(x)}</li>`).join(''); });
  feat.innerHTML = t.feats.map(([a, b]) => `<div><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join('');
  provRows.innerHTML = t.prov.map(([n, c1, a, c2, b]) => `<tr><td><b>${esc(n)}</b></td><td class="${c1}">${esc(a)}</td><td class="${c2}">${esc(b)}</td></tr>`).join('');
  faqList.innerHTML = t.faq.map(([q, a]) => `<details class="q"><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join('');
  altHost.alt = t.altHost; altPlayer.alt = t.altPlayer; altMoment.alt = t.altMoment;
  code.placeholder = lang === 'es' ? 'CÓDIGO' : 'CODE';
  sel.value = lang;
}
const sel = document.getElementById('lang');
